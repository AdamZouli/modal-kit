<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal Kit Command + Toast Demo</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "https://esm.sh/lit@3.2.0",
          "lit/directives/ref.js": "https://esm.sh/lit@3.2.0/directives/ref.js",
          "@modal-kit/core": "../lib/core/index.js",
          "@modal-kit/ui": "../lib/ui/index.js",
          "@modal-kit/web-components": "../lib/web-components/index.js"
        }
      }
    </script>
    <script type="module">
      import "@modal-kit/web-components";

      window.addEventListener("DOMContentLoaded", () => {
        const command = document.querySelector("modal-kit-command");
        const toast = document.querySelector("modal-kit-toast");
        const openCommand = document.getElementById("open-command");
        const openToast = document.getElementById("open-toast");

        openCommand?.addEventListener("click", () => {
          if (command) {
            command.open = true;
          }
        });

        openToast?.addEventListener("click", () => {
          if (toast) {
            toast.open = true;
          }
        });
      });
    </script>
    <style>
      :root {
        color-scheme: dark;
        --mk-bg: #0b0b0b;
        --mk-text: #f5f5f5;
        --mk-card: #111111;
        --mk-border: #f5f5f5;
        --mk-shadow: #ff2d55;
        --mk-accent-1: #ff2d55;
        --mk-accent-2: #0a84ff;
        --mk-accent-3: #30d158;
        --mk-grid: rgba(245, 245, 245, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Space Mono", "IBM Plex Mono", "Courier New", Courier, monospace;
        margin: 0;
        min-height: 100vh;
        font-size: 15px;
        overflow-x: hidden;
        background-color: var(--mk-bg);
        background-image:
          linear-gradient(115deg, rgba(255, 45, 85, 0.2), transparent 40%),
          linear-gradient(220deg, rgba(10, 132, 255, 0.18), transparent 45%),
          linear-gradient(320deg, rgba(48, 209, 88, 0.2), transparent 50%),
          linear-gradient(var(--mk-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--mk-grid) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 100% 100%, 22px 22px, 22px 22px;
        color: var(--mk-text);
      }

      .demo {
        display: grid;
        gap: 20px;
        padding: 28px 20px 44px;
        max-width: 980px;
        margin: 0 auto;
      }

      .demo__header {
        display: grid;
        gap: 10px;
      }

      .demo__header h1 {
        font-size: clamp(2rem, 3vw, 2.6rem);
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .demo__header p {
        margin: 0;
        opacity: 0.75;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .demo__grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      @media (max-width: 760px) {
        .demo__grid {
          grid-template-columns: 1fr;
        }
      }

      .demo-card {
        border-radius: 0;
        padding: 18px;
        background: var(--mk-card);
        border: 3px solid var(--mk-border);
        display: grid;
        gap: 12px;
        box-shadow: 10px 10px 0 var(--mk-accent-1);
      }

      .demo-card h2 {
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 1rem;
      }

      .demo-card p {
        margin: 0;
        opacity: 0.8;
      }

      .demo-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .demo-button {
        border-radius: 0;
        border: 2px solid var(--mk-border);
        background: var(--mk-accent-2);
        color: #0a0a0a;
        padding: 10px 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 700;
        cursor: pointer;
      }

      .demo-button.alt {
        background: transparent;
        color: var(--mk-text);
      }

      .demo-command-list {
        display: grid;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="demo">
      <div class="demo__header">
        <h1>Command + Toast</h1>
        <p>Live demos for Command Palette and Toasts.</p>
      </div>

      <div class="demo__grid">
        <div class="demo-card">
          <h2>Command palette</h2>
          <p>Fast command surface with shared modal behavior.</p>
          <div class="demo-actions">
            <button class="demo-button" id="open-command">Open command</button>
          </div>
        </div>
        <div class="demo-card">
          <h2>Toast</h2>
          <p>Non-modal notification, auto-dismiss after a delay.</p>
          <div class="demo-actions">
            <button class="demo-button alt" id="open-toast">Show toast</button>
          </div>
        </div>
      </div>
    </div>

    <modal-kit-command
      theme="brutalist"
      title="Command palette"
      description="Type to filter actions"
      placeholder="Search actions"
    >
      <div class="demo-command-list">
        <div class="mk-command__item">
          <div>Open settings</div>
          <div class="mk-command__meta">S</div>
        </div>
        <div class="mk-command__item">
          <div>Toggle theme</div>
          <div class="mk-command__meta">T</div>
        </div>
        <div class="mk-command__item">
          <div>New modal</div>
          <div class="mk-command__meta">N</div>
        </div>
      </div>
    </modal-kit-command>

    <modal-kit-toast
      theme="brutalist"
      title="Changes saved"
      description="Your settings were synced."
      duration="2600"
    ></modal-kit-toast>
  </body>
</html>
